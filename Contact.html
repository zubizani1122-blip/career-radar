<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerRadar - Contact</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            Career<span>Radar</span>
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="jobs.html">Jobs</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

            <a href="jobs.html" class="get-started">
                Get Started
            </a>

        </div>

    </nav>


    <!-- Contact Page -->

    <section class="contact-page">


        <div class="contact-intro">

            <span>
                GET IN TOUCH
            </span>

            <h1>
                Let's Talk About
                Your Career
            </h1>

            <p>
                Have a question or need help finding
                the right career opportunity?
                Send us a message.
            </p>

        </div>


        <!-- Contact Form -->

        <div class="contact-form">

            <form>

                <label>
                    Your Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your name"
                >


                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                >


                <label>
                    Subject
                </label>

                <input
                    type="text"
                    placeholder="Enter subject"
                >


                <label>
                    Message
                </label>

                <textarea
                    rows="5"
                    placeholder="Write your message..."
                ></textarea>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>


    </section>


</body>

</html>
